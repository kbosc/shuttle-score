# Source de vérité du projet Xcode. Le .xcodeproj est généré (`make project`)
# et n'est pas versionné.
name: ShuttleScore
options:
  bundleIdPrefix: fr.kbosc
  deploymentTarget:
    watchOS: "26.0"
settings:
  base:
    # Équipe personnelle (compte gratuit) de Kévin : signature automatique sur sa montre.
    DEVELOPMENT_TEAM: Y3435Q8SZL
    CODE_SIGN_STYLE: Automatic
packages:
  ShuttleCore:
    path: ShuttleCore
targets:
  ShuttleScore:
    type: application
    platform: watchOS
    sources: [ShuttleScore]
    dependencies:
      - package: ShuttleCore
        product: ShuttleCore
      - package: ShuttleCore
        product: ShuttleStore
      - sdk: HealthKit.framework
    info:
      # Les tableaux (ici le mode arrière-plan « workout ») ne passent pas par INFOPLIST_KEY_* :
      # ils vont dans ce plist, fusionné avec les clés générées.
      path: ShuttleScore/Info.plist
      properties:
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: ShuttleScore/ShuttleScore.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.kbosc.ShuttleScore
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ShuttleScore
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "ShuttleScore lit ta fréquence cardiaque et tes calories pendant le match."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "ShuttleScore enregistre tes matchs comme séances de badminton dans Santé."
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  ShuttleScoreUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [ShuttleScoreUITests]
    dependencies:
      - target: ShuttleScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.kbosc.ShuttleScoreUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
schemes:
  ShuttleScore:
    build:
      targets:
        ShuttleScore: all
    test:
      targets: [ShuttleScoreUITests]
