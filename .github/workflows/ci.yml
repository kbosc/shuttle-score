name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: make verify

  app:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: make app
      # Rapports complets des tests UI (messages d'erreur, captures), joints au run en cas
      # d'échec : `-quiet` n'affiche que le nom des tests qui échouent.
      - run: make ui-test RESULT_BUNDLE=ui-watch.xcresult
      - run: make ui-test-phone RESULT_BUNDLE=ui-phone.xcresult
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-ui
          path: "*.xcresult"
